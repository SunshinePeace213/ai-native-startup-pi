[project]
name = "ai-native-startup"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: test folders live per layer under tests/ (tests/scripts/llm-wiki, tests/pi/...)
# without __init__.py packages, so basenames may repeat across dirs; importlib mode keeps them
# apart, and pythonpath lets each folder import its own conftest helpers by name.
addopts = "-n auto --import-mode=importlib"
pythonpath = ["tests/scripts/llm-wiki"]
timeout = 60

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
